name: FrogStatus CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  attestations: write

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_OIDC_PROVIDER: ${{ vars.JF_OIDC_PROVIDER }}
  JF_PROJECT: ${{ vars.JF_PROJECT_KEY }}
  JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - uses: ./.github/actions/setup-jfrog-cli
      - run: jf -v && jf rt ping

      - name: Install dependencies
        env:
          JF_NPM_REPOSITORY: ${{ vars.JF_NPM_REPOSITORY }}
        run: |
          jf npmc --global=true --repo-resolve "$JF_NPM_REPOSITORY"
          jf npm cache clean --force
          jf npm install --module frogstatusmod

      - name: Build application
        run: npm run build

      - name: Publish build info
        env:
          # Suppress build-publish from writing to the Job Summary — build-scan
          # writes its own combined entry (build info + security results), so
          # leaving both would produce a duplicate row in the summary.
          JFROG_CLI_COMMAND_SUMMARY_OUTPUT_DIR: ""
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish

      - name: Xray scan build
        run: jf build-scan --project "$JF_PROJECT" --vuln --fail=false

      - name: Write evidence signing key
        id: evd-key
        continue-on-error: true
        env:
          JF_EVD_SIGNING_KEY: ${{ secrets.JF_EVD_SIGNING_KEY }}
        run: |
          [ -z "$JF_EVD_SIGNING_KEY" ] && echo "JF_EVD_SIGNING_KEY not configured — skipping evidence" && exit 1
          printf '%s' "$JF_EVD_SIGNING_KEY" > /tmp/evd-signing-key.pem
          chmod 600 /tmp/evd-signing-key.pem

      - name: Extract SBOM from Xray
        id: sbom
        continue-on-error: true
        if: steps.evd-key.outcome == 'success'
        run: |
          jf xr curl "api/v2/component/exportDetails" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"component_name\": \"${JFROG_CLI_BUILD_NAME}/${JFROG_CLI_BUILD_NUMBER}\",
              \"package_type\": \"build\",
              \"cyclonedx\": true,
              \"cyclonedx_format\": \"json\",
              \"output_format\": \"raw\"
            }" \
            -o sbom.json
          echo "Components: $(jq '.components | length' sbom.json 2>/dev/null || echo 'n/a')"

      - name: Upload SBOM evidence
        continue-on-error: true
        if: steps.sbom.outcome == 'success'
        run: |
          jf evd create \
            --predicate sbom.json \
            --predicate-type "https://cyclonedx.org/bom/v1.6" \
            --build-name "$JFROG_CLI_BUILD_NAME" \
            --build-number "$JFROG_CLI_BUILD_NUMBER" \
            --key /tmp/evd-signing-key.pem \
            --key-alias "${{ vars.JF_EVD_KEY_ALIAS }}" \
            --project "$JF_PROJECT"

      - name: Build Xray scan predicate
        id: xray-report
        continue-on-error: true
        if: steps.evd-key.outcome == 'success'
        run: |
          cat > xray-report.json <<EOF
          {
            "scanner": "JFrog Xray",
            "build_name": "${JFROG_CLI_BUILD_NAME}",
            "build_number": "${JFROG_CLI_BUILD_NUMBER}",
            "scan_url": "${JFROG_CLI_BUILD_URL}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload Xray scan evidence
        continue-on-error: true
        if: steps.xray-report.outcome == 'success'
        run: |
          jf evd create \
            --predicate xray-report.json \
            --predicate-type "https://jfrog.com/evidence/xray-vulnerability-report/v1" \
            --build-name "$JFROG_CLI_BUILD_NAME" \
            --build-number "$JFROG_CLI_BUILD_NUMBER" \
            --key /tmp/evd-signing-key.pem \
            --key-alias "${{ vars.JF_EVD_KEY_ALIAS }}" \
            --project "$JF_PROJECT"

      - name: Upload SonarQube evidence
        continue-on-error: true
        if: steps.evd-key.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          jf evd create \
            --integration sonar \
            --build-name "$JFROG_CLI_BUILD_NAME" \
            --build-number "$JFROG_CLI_BUILD_NUMBER" \
            --key /tmp/evd-signing-key.pem \
            --key-alias "${{ vars.JF_EVD_KEY_ALIAS }}" \
            --project "$JF_PROJECT"

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/evd-signing-key.pem

      - name: Build Docker image tag
        id: docker-tag
        run: |
          JF_HOST="${JF_URL#https://}"
          JF_HOST="${JF_HOST#http://}"
          JF_HOST="${JF_HOST%/}"
          echo "tag=${JF_HOST}/${{ vars.JF_DOCKER_REPOSITORY }}/frogstatus:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          JF_NPM_REPOSITORY: ${{ vars.JF_NPM_REPOSITORY }}
          DOCKER_BUILDKIT: 1
        run: |
          jf docker build -f infra/Dockerfile \
            --build-arg JF_URL="${JF_URL}" \
            --build-arg JF_NPM_REPOSITORY="${JF_NPM_REPOSITORY}" \
            --secret id=jfrog_config,src=$HOME/.jfrog/jfrog-cli.conf.v6 \
            -t ${{ steps.docker-tag.outputs.tag }} .
          jf docker push ${{ steps.docker-tag.outputs.tag }}

      - name: Scan Docker image
        run: jf docker scan ${{ steps.docker-tag.outputs.tag }} --project "$JF_PROJECT" --vuln --fail=false
