name: FrogStatus CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  attestations: write

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_OIDC_PROVIDER: ${{ vars.JF_OIDC_PROVIDER }}
  JF_PROJECT: ${{ vars.JF_PROJECT_KEY }}
  JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - uses: ./.github/actions/setup-jfrog-cli
      - run: jf -v && jf rt ping

      - name: Install dependencies
        env:
          JF_NPM_REPOSITORY: ${{ vars.JF_NPM_REPOSITORY }}
        run: |
          jf npmc --global=true --repo-resolve "$JF_NPM_REPOSITORY"
          jf npm cache clean --force
          jf npm install --module frogstatusmod

      - name: Build application
        run: npm run build

      - name: Publish build info
        env:
          # Suppress build-publish from writing to the Job Summary — build-scan
          # writes its own combined entry (build info + security results), so
          # leaving both would produce a duplicate row in the summary.
          JFROG_CLI_COMMAND_SUMMARY_OUTPUT_DIR: ""
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish

      - name: Xray scan build
        run: jf build-scan --project "$JF_PROJECT" --vuln --fail=false

      - name: Secrets scan
        id: secrets-scan
        continue-on-error: true
        run: |
          jf audit --secrets --format simple-json 2>/dev/null | \
            jq '{secrets: [.secrets[]? | {severity, ruleId, file, startLine, endLine, finding}], scansStatus: .scansStatus}' \
            > secrets-scan.json
          jq -e 'has("secrets")' secrets-scan.json >/dev/null
          echo "Secrets found: $(jq '.secrets | length' secrets-scan.json)"

      - name: Curation audit
        id: curation-audit
        continue-on-error: true
        run: |
          jf curation-audit --format json 2>/dev/null | sed -n '/^\[/,$ p' > curation-audit.json
          [ -s curation-audit.json ] || echo '[]' > curation-audit.json
          jq -e 'type == "array"' curation-audit.json >/dev/null
          echo "Blocked packages: $(jq 'length' curation-audit.json)"

      - name: Build Docker image tag
        id: docker-tag
        run: |
          JF_HOST="${JF_URL#https://}"
          JF_HOST="${JF_HOST#http://}"
          JF_HOST="${JF_HOST%/}"
          echo "tag=${JF_HOST}/${{ vars.JF_DOCKER_REPOSITORY }}/frogstatus:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker-push
        env:
          JF_NPM_REPOSITORY: ${{ vars.JF_NPM_REPOSITORY }}
          DOCKER_BUILDKIT: 1
        run: |
          jf docker build -f infra/Dockerfile \
            --build-arg JF_URL="${JF_URL}" \
            --build-arg JF_NPM_REPOSITORY="${JF_NPM_REPOSITORY}" \
            --secret id=jfrog_config,src=$HOME/.jfrog/jfrog-cli.conf.v6 \
            -t ${{ steps.docker-tag.outputs.tag }} .
          jf docker push ${{ steps.docker-tag.outputs.tag }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.docker-tag.outputs.tag }} | grep -oE 'sha256:[a-f0-9]+')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          # Manifest path in JFrog: <repo>/<image>/<tag>/manifest.json
          IMAGE_PATH="${{ vars.JF_DOCKER_REPOSITORY }}/frogstatus/${GITHUB_SHA::7}/manifest.json"
          echo "manifest_path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: oci://${{ steps.docker-tag.outputs.tag }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}

      - name: Upload secrets scan evidence
        continue-on-error: true
        if: steps.secrets-scan.outcome == 'success'
        env:
          JFROG_CLI_SIGNING_KEY: ${{ secrets.JF_EVD_SIGNING_KEY }}
          JFROG_CLI_KEY_ALIAS: ${{ vars.JF_EVD_KEY_ALIAS }}
        run: |
          jf evd create \
            --predicate secrets-scan.json \
            --predicate-type "https://jfrog.com/evidence/secret-detection/v1" \
            --subject-repo-path "${{ steps.docker-push.outputs.manifest_path }}" \
            --project "$JF_PROJECT"

      - name: Upload curation audit evidence
        continue-on-error: true
        if: steps.curation-audit.outcome == 'success'
        env:
          JFROG_CLI_SIGNING_KEY: ${{ secrets.JF_EVD_SIGNING_KEY }}
          JFROG_CLI_KEY_ALIAS: ${{ vars.JF_EVD_KEY_ALIAS }}
        run: |
          jf evd create \
            --predicate curation-audit.json \
            --predicate-type "https://jfrog.com/evidence/curation-audit/v1" \
            --subject-repo-path "${{ steps.docker-push.outputs.manifest_path }}" \
            --project "$JF_PROJECT"

      - name: Upload SonarQube evidence
        continue-on-error: true
        env:
          JFROG_CLI_SIGNING_KEY: ${{ secrets.JF_EVD_SIGNING_KEY }}
          JFROG_CLI_KEY_ALIAS: ${{ vars.JF_EVD_KEY_ALIAS }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          jf evd create \
            --integration sonar \
            --subject-repo-path "${{ steps.docker-push.outputs.manifest_path }}" \
            --project "$JF_PROJECT"

      - name: Upload SLSA provenance as JFrog evidence
        continue-on-error: true
        env:
          JFROG_CLI_SIGNING_KEY: ${{ secrets.JF_EVD_SIGNING_KEY }}
          JFROG_CLI_KEY_ALIAS: ${{ vars.JF_EVD_KEY_ALIAS }}
        run: |
          jq -r '.dsseEnvelope.payload' "${{ steps.attest.outputs.bundle-path }}" | base64 -d > slsa-provenance.json
          jf evd create \
            --predicate slsa-provenance.json \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --subject-repo-path "${{ steps.docker-push.outputs.manifest_path }}" \
            --project "$JF_PROJECT"

      - name: Scan Docker image
        run: jf docker scan ${{ steps.docker-tag.outputs.tag }} --project "$JF_PROJECT" --vuln --fail=false
