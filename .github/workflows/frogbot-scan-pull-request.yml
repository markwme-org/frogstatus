name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [ opened, synchronize ]
permissions:
  pull-requests: write
  contents: read
  security-events: write
  # [Mandatory if using OIDC authentication protocol instead of JF_ACCESS_TOKEN]
  id-token: write

jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    # pull_request_target exposes secrets to PR-triggered runs, so only scan PRs
    # from branches in this repository (not forks). Only people with write access
    # can create those, which replaces the manual approval gate used with Frogbot v2.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: jfrog/frogbot@v3
        env:
          JF_URL: ${{ secrets.JF_URL }}
          # JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload PR findings to GitHub Code Scanning (Frogbot 3.4+). Needs the
          # security-events: write permission above.
          JF_UPLOAD_PR_SECURITY_RESULTS_TO_VCS: "true"
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}