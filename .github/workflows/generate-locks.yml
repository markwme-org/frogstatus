name: Generate Demo Lock Files

# Resolves the demo dependency sets on a clean runner and uploads the resulting
# package-lock.json variants as an artefact. Download them with:
#   gh run download <run-id> -n demo-locks -D scripts/locks
#
# Why a runner: resolving on a laptop behind a transparently redirecting proxy
# bakes internal registry URLs into the lock file. This workflow uses
# `npm install --package-lock-only`, so only metadata is fetched; nothing is
# installed and no install scripts run.

on:
  workflow_dispatch:
    inputs:
      package_json:
        description: "Optional: full package.json text. If set, only that file is resolved and the artefact is named demo-lock-current (used by scripts/refresh-lock.sh)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Generate the three demo lock files
        if: inputs.package_json == ''
        run: node scripts/generate-locks.mjs "$RUNNER_TEMP/locks"

      - name: Generate a lock file for the supplied package.json
        if: inputs.package_json != ''
        env:
          # Passed through the environment, never interpolated into the script.
          PACKAGE_JSON: ${{ inputs.package_json }}
        run: |
          printf '%s' "$PACKAGE_JSON" > "$RUNNER_TEMP/supplied-package.json"
          node scripts/generate-locks.mjs "$RUNNER_TEMP/locks" --package-json "$RUNNER_TEMP/supplied-package.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_json == '' && 'demo-locks' || 'demo-lock-current' }}
          path: ${{ runner.temp }}/locks/*.json
          if-no-files-found: error
