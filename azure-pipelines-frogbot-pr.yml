pr:
  branches:
    include:
      - '*'

trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-config

permissions:
  id-token: write
  contents: read

jobs:
  - job: FrogbotScanPullRequest
    displayName: Frogbot Scan Pull Request
    steps:
      - checkout: self

      - task: JfrogCliV2@1
        displayName: Setup JFrog CLI (OIDC)
        inputs:
          jfrogPlatformConnection: jfrog-mwldn
          command: jf rt ping

      - script: |
          # Attempt to reuse the OIDC-exchanged access token from the CLI config
          JF_ACCESS_TOKEN=$(jf config show --format json 2>/dev/null | jq -r '.[0].accessToken // empty')
          if [ -z "$JF_ACCESS_TOKEN" ]; then
            echo "##[warning]Could not retrieve OIDC access token from CLI config - falling back to JF_ACCESS_TOKEN variable"
          else
            echo "##vso[task.setvariable variable=JF_ACCESS_TOKEN;issecret=true]$JF_ACCESS_TOKEN"
            echo "OIDC access token retrieved successfully"
          fi
        displayName: Extract OIDC access token
        continueOnError: true

      - script: |
          curl -fL "https://releases.jfrog.io/artifactory/frogbot/v3/[RELEASE]/getFrogbot.sh" | sh
          ./frogbot scan-pull-request
        displayName: Run Frogbot PR scan
        env:
          JF_URL: $(JF_URL)
          JF_ACCESS_TOKEN: $(JF_ACCESS_TOKEN)
          JF_GIT_TOKEN: $(System.AccessToken)
          JF_GIT_PROVIDER: azureRepos
          JF_GIT_OWNER: $(System.TeamProject)
          JF_GIT_REPO: $(Build.Repository.Name)
          JF_GIT_BASE_BRANCH: $(System.PullRequest.TargetBranch)
          JF_GIT_PULL_REQUEST_ID: $(System.PullRequest.PullRequestId)
