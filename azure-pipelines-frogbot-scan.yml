schedules:
  - cron: '0 0 * * *'
    displayName: Daily midnight scan
    branches:
      include:
        - main

pr: none
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-config

jobs:
  - job: FrogbotScanRepository
    displayName: Frogbot Scan Repository
    steps:
      - checkout: self

      - script: |
          curl -fL "https://releases.jfrog.io/artifactory/frogbot/v3/[RELEASE]/getFrogbot.sh" | sh
          ./frogbot scan-repository
        displayName: Run Frogbot repository scan
        env:
          JF_URL: $(JF_URL)
          JF_ACCESS_TOKEN: $(JF_ACCESS_TOKEN)
          JF_GIT_TOKEN: $(System.AccessToken)
          JF_GIT_PROVIDER: azureRepos
          JF_GIT_OWNER: $(System.TeamProject)
          JF_GIT_REPO: $(Build.Repository.Name)
