schedules:
  - cron: '0 0 * * *'
    displayName: Daily midnight scan
    branches:
      include:
        - main

pr: none
trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-config

jobs:
  - job: FrogbotScanRepository
    displayName: Frogbot Scan Repository
    steps:
      - checkout: none

      - task: CmdLine@2
        displayName: Download and Run Frogbot
        env:
          JF_URL: $(JF_URL)
          JF_ACCESS_TOKEN: $(JF_ACCESS_TOKEN)
          JF_GIT_TOKEN: $(JF_GIT_TOKEN)
          JF_PROJECT_KEY: $(JF_PROJECT_KEY)
          JF_GIT_PROVIDER: azureRepos
          JF_GIT_API_ENDPOINT: $(System.CollectionUri)
          JF_GIT_OWNER: $(System.TeamProject)
          JF_GIT_PROJECT: $(System.TeamProject)
          JF_GIT_REPO: $(Build.Repository.Name)
          JFROG_CLI_LOG_LEVEL: DEBUG
        inputs:
          script: |
            curl -fLg "https://releases.jfrog.io/artifactory/frogbot/v3/[RELEASE]/getFrogbot.sh" | sh
            ./frogbot scan-repository
