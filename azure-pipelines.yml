trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-config
  - name: JFROG_CLI_BUILD_NAME
    value: $(Build.DefinitionName)
  - name: JFROG_CLI_BUILD_NUMBER
    value: $(Build.BuildNumber)

steps:
  - checkout: self

  - task: UseNode@1
    displayName: Setup Node.js 24.x
    inputs:
      version: '24.x'

  - task: JfrogCliV2@1
    displayName: Setup JFrog CLI
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: jf rt ping

  - script: rm -f package-lock.json
    displayName: Remove lock file to force resolution via Artifactory

  - task: JfrogCliV2@1
    displayName: Curation audit
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: |
        jf npmc --global=true --repo-resolve=$(JF_NPM_REPOSITORY)
        jf curation-audit

  - task: JFrogNpm@1
    displayName: Install dependencies
    inputs:
      command: install
      artifactoryConnection: jfrog-mwldn-artifactory
      sourceRepo: $(JF_NPM_REPOSITORY)
      collectBuildInfo: true
      buildName: $(JFROG_CLI_BUILD_NAME)
      buildNumber: $(JFROG_CLI_BUILD_NUMBER)
      includeEnvVars: true

  - script: npm run build
    displayName: Build application

  - task: JfrogCliV2@1
    displayName: Add git info to build
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: jf rt build-add-git

  - task: JFrogPublishBuildInfo@1
    displayName: Publish build info
    inputs:
      artifactoryConnection: jfrog-mwldn-artifactory
      buildName: $(JFROG_CLI_BUILD_NAME)
      buildNumber: $(JFROG_CLI_BUILD_NUMBER)

  - task: JFrogBuildScan@1
    displayName: Xray scan build
    inputs:
      xrayConnection: jfrog-mwldn-xray
      buildName: $(JFROG_CLI_BUILD_NAME)
      buildNumber: $(JFROG_CLI_BUILD_NUMBER)
      allowFailBuild: false
      vuln: true

  - script: |
      jf audit --secrets --format simple-json 2>/dev/null | \
        jq '{secrets: [.secrets[]? | {severity, ruleId, file, startLine, endLine, finding}], scansStatus: .scansStatus}' \
        > secrets-scan.json 2>/dev/null
      [ -s secrets-scan.json ] || echo '{"secrets":[],"scansStatus":{}}' > secrets-scan.json
      echo "Secrets found: $(jq '.secrets | length' secrets-scan.json)"
    displayName: Secrets scan
    continueOnError: true

  - script: |
      RAW=$(jf curation-audit --format json 2>/dev/null | sed -n '/^\[/,$ p')
      [ -z "$RAW" ] && RAW='[]'
      echo "{\"blocked_packages\": ${RAW}}" > curation-audit.json
      jq -e '.blocked_packages | type == "array"' curation-audit.json >/dev/null
      echo "Blocked packages: $(jq '.blocked_packages | length' curation-audit.json)"
    displayName: Curation audit
    continueOnError: true

  - script: |
      JF_HOST="${JF_URL#https://}"
      JF_HOST="${JF_HOST#http://}"
      JF_HOST="${JF_HOST%/}"
      SHORT_SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
      DOCKER_TAG="${JF_HOST}/$(JF_DOCKER_REPOSITORY)/frogstatus:${SHORT_SHA}"
      echo "##vso[task.setvariable variable=DOCKER_TAG]${DOCKER_TAG}"
      echo "##vso[task.setvariable variable=MANIFEST_PATH]$(JF_DOCKER_REPOSITORY)/frogstatus/${SHORT_SHA}/manifest.json"
      echo "##vso[task.setvariable variable=AGENT_HOME]$HOME"
    displayName: Build Docker image tag

  - task: JfrogCliV2@1
    displayName: Build Docker image
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: >
        jf docker build -f infra/Dockerfile
        --build-arg JF_URL="$(JF_URL)"
        --build-arg JF_NPM_REPOSITORY="$(JF_NPM_REPOSITORY)"
        --secret id=jfrog_config,src=$(AGENT_HOME)/.jfrog/jfrog-cli.conf.v6
        -t $(DOCKER_TAG) .
    env:
      DOCKER_BUILDKIT: 1

  - task: JfrogCliV2@1
    displayName: Push Docker image
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: jf docker push $(DOCKER_TAG)

  - task: DownloadSecureFile@1
    name: signingKey
    displayName: Download signing key
    inputs:
      secureFile: markw-jfrog-private-key

  - task: JfrogCliV2@1
    displayName: Upload secrets scan evidence
    continueOnError: true
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: >
        jf evd create
        --predicate secrets-scan.json
        --predicate-type "https://jfrog.com/evidence/secret-detection/v1"
        --subject-repo-path "$(MANIFEST_PATH)"
        --project "$(JF_PROJECT_KEY)"
        --key $(signingKey.secureFilePath)
        --key-alias $(JF_EVD_KEY_ALIAS)

  - task: JfrogCliV2@1
    displayName: Upload curation audit evidence
    continueOnError: true
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: >
        jf evd create
        --predicate curation-audit.json
        --predicate-type "https://jfrog.com/evidence/curation-audit/v1"
        --subject-repo-path "$(MANIFEST_PATH)"
        --project "$(JF_PROJECT_KEY)"
        --key $(signingKey.secureFilePath)
        --key-alias $(JF_EVD_KEY_ALIAS)

  - task: JfrogCliV2@1
    displayName: Scan Docker image
    inputs:
      jfrogPlatformConnection: jfrog-mwldn
      command: jf docker scan $(DOCKER_TAG) --vuln --fail=false
